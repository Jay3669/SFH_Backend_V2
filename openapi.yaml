openapi: 3.0.3
info:
  title: Surya Food Hub API
  version: 1.0.0
  description: >
    Branch-scoped stock, menu, recipe, production, and staff requests accept
    the X-Branch-Id header. Non-admin users are limited to their assigned branch.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /admin/branches:
    get:
      summary: List branches available to the authenticated user
      responses:
        '200':
          description: Branch list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a branch
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchInput'
      responses:
        '201':
          description: Branch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A branch with that name or code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/branches/{branchId}:
    parameters:
      - in: path
        name: branchId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update branch details
      description: Admin only; omitted fields retain their existing values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchUpdate'
      responses:
        '200':
          description: Branch updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Permanently delete an empty branch
      description: Admin only; branches with dependent records cannot be deleted.
      responses:
        '200':
          description: Branch deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Branch still has dependent records or is the last branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/production/menu-categories:
    get:
      summary: List menu categories
      description: Defaults to display_order ascending; supports search, status filtering, sorting, and pagination.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: status
          schema: { type: string, enum: [all, active, inactive], default: all }
        - in: query
          name: sort
          schema: { type: string, enum: [displayOrder, name, createdAt], default: displayOrder }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Category list and pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a menu category
      description: displayOrder is assigned by PostgreSQL when omitted. Names are unique case-insensitively.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCategoryInput'
            example:
              name: Breakfast
              description: Morning dishes
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A category with that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/production/menu-categories/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a menu category
      responses:
        '200':
          description: Category details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a menu category
      description: Omitted fields retain their existing values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCategoryUpdate'
            example:
              description: Morning and brunch dishes
              displayOrder: 2
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A category with that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      summary: Partially update a menu category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCategoryUpdate'
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A category with that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete or deactivate a menu category
      description: Deletes an unused category; deactivates a category with associated menu items.
      responses:
        '200':
          description: Category deleted or safely deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMenuCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/production/availability:
    get:
      summary: Read daily plate availability
      description: Returns confirmed production totals, completed sales and remaining plates for a business date.
      parameters:
        - in: query
          name: productionDate
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Date-specific available menu items and totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode: { type: integer }
                  status: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/production/sales:
    post:
      summary: Complete a POS sale
      description: Cashier-confirmed checkout. The API serializes access by production date, validates plate availability and is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productionDate, idempotencyKey, paymentMethod, items]
              properties:
                productionDate: { type: string, format: date }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
                paymentMethod: { type: string, enum: [cash, upi, card, split] }
                discountAmount: { type: number, minimum: 0 }
                settingsUpdatedAt: { type: string, format: date-time }
                paymentBreakdown:
                  type: object
                  minProperties: 2
                  maxProperties: 2
                  additionalProperties: false
                  properties:
                    cash: { type: number, exclusiveMinimum: 0 }
                    card: { type: number, exclusiveMinimum: 0 }
                    upi: { type: number, exclusiveMinimum: 0 }
                taxRate: { type: number, minimum: 0, maximum: 100 }
                packingCharge: { type: number, minimum: 0 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [menuItemId, quantity]
                    properties:
                      menuItemId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '201':
          description: Payment recorded and sale completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode: { type: integer }
                  status: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    additionalProperties: true
        '200':
          description: Identical idempotent sale already completed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The day is closed, the menu item is unavailable, or plates have already been sold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/production/close:
    post:
      summary: Close daily production
      description: Locks the production date, records unsold plates as wastage and disables further checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productionDate]
              properties:
                productionDate: { type: string, format: date }
      responses:
        '200':
          description: Production date closed with wastage and profit/loss totals.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Production date is already closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /admin/production/financial-reports:
    get:
      summary: Read production, sales and profit/loss reports
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: menuItemId
          schema: { type: string, format: uuid }
        - in: query
          name: paymentMethod
          schema: { type: string, enum: [cash, upi, card, split, all] }
        - in: query
          name: paymentStatus
          schema: { type: string, enum: [completed, failed, cancelled, all] }
      responses:
        '200':
          description: Item/day details, payment summaries, expenses and gross/net profit/loss.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/production/expenses:
    get:
      summary: List operating expenses
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Expense rows for the selected date range.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Record an operating expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expenseDate, category, description, amount]
              properties:
                expenseDate: { type: string, format: date }
                category: { type: string, maxLength: 60 }
                description: { type: string, maxLength: 255 }
                amount: { type: number, exclusiveMinimum: 0 }
      responses:
        '201':
          description: Expense recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/settings:
    get:
      summary: Read shared application settings
      description: Requires point-of-sale read permission.
      responses:
        '200':
          description: Current settings and the next sequential invoice number.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Update shared application settings
      description: Admin-only. Changes are shared across all registers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSettings'
      responses:
        '200':
          description: Updated settings and the next sequential invoice number.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Branch:
      type: object
      required: [id, name, code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 20 }
        address: { type: string, nullable: true, maxLength: 500 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true, maxLength: 254 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchInput:
      type: object
      required: [name, code]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        address: { type: string, nullable: true, maxLength: 500 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true, maxLength: 254 }
    BranchUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 20, pattern: '^[A-Za-z0-9_-]+$' }
        address: { type: string, nullable: true, maxLength: 500 }
        phone: { type: string, nullable: true, maxLength: 30 }
        email: { type: string, format: email, nullable: true, maxLength: 254 }
    BranchResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 200 }
        status: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          $ref: '#/components/schemas/Branch'
    BranchListResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 200 }
        status: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
    ApplicationSettings:
      type: object
      additionalProperties: false
      required: [billing, payments, regional]
      properties:
        billing:
          type: object
          additionalProperties: false
          required: [invoicePrefix, tax, packingCharge, additionalCharges]
          properties:
            invoicePrefix: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$' }
            tax:
              type: object
              additionalProperties: false
              required: [enabled, rate]
              properties:
                enabled: { type: boolean }
                rate: { type: number, minimum: 0, maximum: 100 }
            packingCharge:
              type: object
              additionalProperties: false
              required: [enabled, amount]
              properties:
                enabled: { type: boolean }
                amount: { type: number, minimum: 0 }
            additionalCharges:
              type: array
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [id, name, enabled, calculationType, amount]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string, minLength: 1, maxLength: 40 }
                  enabled: { type: boolean }
                  calculationType: { type: string, enum: [fixed, percentage] }
                  amount: { type: number, minimum: 0 }
        payments:
          type: object
          additionalProperties: false
          required: [enabledMethods, allowSplit]
          properties:
            enabledMethods:
              type: object
              additionalProperties: false
              required: [cash, card, upi]
              properties:
                cash: { type: boolean }
                card: { type: boolean }
                upi: { type: boolean }
            allowSplit: { type: boolean }
        regional:
          type: object
          additionalProperties: false
          required: [dateFormat, timeFormat, timeZone]
          properties:
            dateFormat: { type: string, enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD] }
            timeFormat: { type: string, enum: [12h, 24h] }
            timeZone: { type: string, maxLength: 64 }
    MenuCategory:
      type: object
      required: [id, name, displayOrder, isActive, menuItemCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 255 }
        imageUrl: { type: string, nullable: true, maxLength: 2048 }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        menuItemCount: { type: integer, minimum: 0 }
    MenuCategoryInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 255 }
        imageUrl: { type: string, nullable: true, maxLength: 2048 }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean, default: true }
    MenuCategoryUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, nullable: true, maxLength: 255 }
        imageUrl: { type: string, nullable: true, maxLength: 2048 }
        displayOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    MenuCategoryResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 200 }
        status: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          $ref: '#/components/schemas/MenuCategory'
    MenuCategoryListResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 200 }
        status: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
    DeleteMenuCategoryResponse:
      type: object
      properties:
        statusCode: { type: integer, example: 200 }
        status: { type: string, example: SUCCESS }
        message: { type: string }
        data:
          type: object
          properties:
            categoryId: { type: string, format: uuid }
            deleted: { type: boolean }
            deactivated: { type: boolean }
            associatedMenuItemCount: { type: integer }
            category:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/MenuCategory'
    ApiError:
      type: object
      properties:
        statusCode: { type: integer }
        status: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid path, query, or request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: A valid bearer access token is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated role lacks the required menu permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Menu category does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
